[package]
name = "kraskus-cmfd-prover"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Kraskus remote LAN prover service for Common Foundry solo mining (not upstream)"

[features]
default = []
production-mainnet = ["cmfd-node/production-mainnet"]

[dependencies]
clap.workspace = true
cmfd-consensus = { path = "../cmfd-consensus" }
cmfd-node = { path = "../cmfd-node" }
hex.workspace = true
kraskus-cmfd-prover-wire = { path = "../kraskus-cmfd-prover-wire" }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true

[dev-dependencies]
rcgen = "=0.14.5"

[[bin]]
name = "kraskus-cmfd-prover"
path = "src/main.rs"
